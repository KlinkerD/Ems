name: modbus-meters

# Läuft nur, wenn sich dieser Service oder seine Pipeline ändert.
# Für einen neuen Service diese Datei kopieren und SERVICE anpassen.
on:
  push:
    branches: [ "master" ]
    paths:
      - "services/modbus-meters/**"
      - ".github/workflows/modbus-meters.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "services/modbus-meters/**"
      - ".github/workflows/modbus-meters.yml"

env:
  REGISTRY: ghcr.io
  SERVICE: modbus-meters

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nötig, damit GITHUB_TOKEN nach ghcr.io pushen darf

    steps:
      - uses: actions/checkout@v4

      - name: Login bei ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: services/${{ env.SERVICE }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
